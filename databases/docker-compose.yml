services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - 6379:6379

  mongodb:
    image: mongo:5.0.2
    container_name: mongodb
    restart: unless-stopped
    ports:
      - 7017:27017
    volumes:
      - db:/data/db
      - ./dump:/data

volumes:
  db:

